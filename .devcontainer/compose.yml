version: '3.8'
services:
   dev:
      build:
         context: .
         dockerfile: dev.Dockerfile
      volumes:
         - ../../MacAdresseDatenbank:/workspace
         - dist:/dist/www
      ports:
         - "9003:9003"
      tty: true
      stdin_open: true
      environment:
         - GQL_UI=true
      networks:
         - app-network

   php:
      build:
         context: .
         dockerfile: php_server.Dockerfile
      ports:
         - "8080:80"
      volumes:
         - dist:/var/www
         - ../logs:/var/log
      environment:
         - XDEBUG_MODE=debug
         - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
         - APP_ENV=development
      networks:
         - app-network

   mysql:
      image: mysql:8.0
      environment:
         MYSQL_ROOT_PASSWORD: root
         MYSQL_DATABASE: app_db
      ports:
         - "3306:3306"
      volumes:
         - mysql_data:/var/lib/mysql
      networks:
         - app-network

volumes:
   mysql_data:
   dist:

networks:
   app-network:
      driver: bridge
